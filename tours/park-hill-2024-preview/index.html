const big = (() => { try { const c=document.createElement('canvas').getContext('webgl'); return c && c.getParameter(c.MAX_TEXTURE_SIZE) >= 8192 && innerWidth > 900; } catch(e){ return false; } })();
const scenes = {};
for (const s of TOUR.scenes) {
  scenes[s.id] = {
    title: s.name, type: 'equirectangular', panorama: s.files[big ? '6k' : '4k'],
    haov: s.haov, vaov: s.vaov, yaw: s.start_yaw || 0, hfov: 100,
    hotSpots: (s.links || []).map(l => ({ type:'scene', sceneId:l.to, yaw:l.yaw, pitch:l.pitch ?? -10,
      text: (TOUR.scenes.find(x => x.id === l.to) || {}).name || '' }))
  };
  if (s.vaov < 180) { scenes[s.id].minPitch = -s.vaov/2; scenes[s.id].maxPitch = s.vaov/2; }
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const viewer = pannellum.viewer('tour', { default: { firstScene: TOUR.first_scene, autoLoad: true, compass: false,
  sceneFadeDuration: 600, autoRotate: (TOUR.auto_rotate && !reduce) ? -1.5 : 0, autoRotateInactivityDelay: 8000,
  showZoomCtrl: !matchMedia('(pointer: coarse)').matches }, scenes });
const strip = document.getElementById('strip'), room = document.getElementById('room'), tabs = document.getElementById('tabs');
const groups = TOUR.groups && TOUR.groups.length > 1 ? TOUR.groups : null;
let shownGroup = null;
function showGroup(g){
  shownGroup = g; strip.innerHTML = '';
  for (const s of TOUR.scenes.filter(x => !groups || x.group === g)) {
    const b = document.createElement('button');
    b.innerHTML = `<img src="${s.thumb}" alt="" loading="lazy"><span></span>`;
    b.querySelector('span').textContent = s.name;
    b.onclick = () => viewer.loadScene(s.id);
    b.dataset.id = s.id; strip.appendChild(b);
  }
  for (const t of tabs.children) t.setAttribute('aria-selected', t.textContent === g);
}
if (groups) {
  document.body.classList.add('has-tabs');
  for (const g of groups) { const t = document.createElement('button'); t.setAttribute('role','tab'); t.textContent = g; t.onclick = () => showGroup(g); tabs.appendChild(t); }
}
function mark(id){
  const sc = TOUR.scenes.find(x => x.id === id) || {};
  if (groups && sc.group !== shownGroup) showGroup(sc.group);
  if (!groups && !strip.children.length) showGroup(null);
  for (const b of strip.children) { const on = b.dataset.id === id; b.setAttribute('aria-current', on); if (on) b.scrollIntoView({inline:'center', block:'nearest'}); }
  room.textContent = sc.name || ''; }
viewer.on('scenechange', mark); mark(TOUR.first_scene);
